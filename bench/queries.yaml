# Curated bench queries. Each has expected ISBN or md5 to validate match.
#
# Phase 6v.3: queries are tagged so each scraper only sees queries it
# can plausibly answer. KindleBangla shouldn't be benched against
# "Sapiens" (only Bengali catalogue); Gutendex shouldn't be benched
# against "Project Hail Mary" (PD only). `corpus_tags` below maps each
# scraper to the set of tags it should see; scrapers not listed run
# against every query (the default for general-purpose backends like
# annas_curl / libgen / zlib).

queries:
  # ---- modern English ----
  - title: "The Pragmatic Programmer"
    author: "Hunt"
    isbn13: "9780135957059"
    language: "en"
    tags: [en, modern]
  - title: "Sapiens A Brief History of Humankind"
    author: "Harari"
    isbn13: "9780062316097"
    language: "en"
    tags: [en, modern]
  - title: "Project Hail Mary"
    author: "Weir"
    isbn13: "9780593135204"
    language: "en"
    tags: [en, modern]
  - title: "Designing Data-Intensive Applications"
    author: "Kleppmann"
    isbn13: "9781449373320"
    language: "en"
    tags: [en, modern]
  - title: "Atomic Habits"
    author: "Clear"
    isbn13: "9780735211292"
    language: "en"
    tags: [en, modern]
  - title: "Educated"
    author: "Westover"
    isbn13: "9780399590504"
    language: "en"
    tags: [en, modern]
  - title: "The Three-Body Problem"
    author: "Liu"
    isbn13: "9780765382030"
    language: "en"
    tags: [en, modern]
  - title: "Thinking Fast and Slow"
    author: "Kahneman"
    isbn13: "9780374533557"
    language: "en"
    tags: [en, modern]
  - title: "Crime and Punishment"
    author: "Dostoevsky"
    isbn13: "9780486415871"
    language: "en"
    tags: [en, modern]
  - title: "Clean Code"
    author: "Martin"
    isbn13: "9780132350884"
    language: "en"
    tags: [en, modern]

  # ---- public-domain English (Gutenberg-era; pre-1928) ----
  # For PD-only scrapers (gutendex, standard_ebooks, oapen_doab,
  # wikisource). ISBNs intentionally blank — these works predate ISBN
  # and PD scrapers match on title+author.
  - title: "Pride and Prejudice"
    author: "Austen"
    isbn13: ""
    language: "en"
    tags: [en, pd]
  - title: "Frankenstein"
    author: "Shelley"
    isbn13: ""
    language: "en"
    tags: [en, pd]
  - title: "The Adventures of Sherlock Holmes"
    author: "Doyle"
    isbn13: ""
    language: "en"
    tags: [en, pd]
  - title: "Moby Dick"
    author: "Melville"
    isbn13: ""
    language: "en"
    tags: [en, pd]
  - title: "Alice's Adventures in Wonderland"
    author: "Carroll"
    isbn13: ""
    language: "en"
    tags: [en, pd]

  # ---- Bengali (kindlebangla source) ----
  # Real slugs verified against the kindlebangla catalogue. The
  # kindlebangla_curl scraper matches by slug, which is also stored
  # as the goodreads_id when this source is used.
  - title: "হিমু"
    author: "Humayun Ahmed"
    isbn13: ""
    language: "bn"
    tags: [bn, kindlebangla]
  - title: "ময়ূরাক্ষী"
    author: "Humayun Ahmed"
    isbn13: ""
    language: "bn"
    tags: [bn, kindlebangla]
  - title: "এবং হিমু"
    author: "Humayun Ahmed"
    isbn13: ""
    language: "bn"
    tags: [bn, kindlebangla]
  - title: "দরজার ওপাশে"
    author: "Humayun Ahmed"
    isbn13: ""
    language: "bn"
    tags: [bn, kindlebangla]
  - title: "পারাপার"
    author: "Humayun Ahmed"
    isbn13: ""
    language: "bn"
    tags: [bn, kindlebangla]

# Per-scraper corpus filter. Scrapers listed here will ONLY be tested
# against queries that match the listed tags. Scrapers not listed get
# the full corpus (general-purpose backends).
corpus_tags:
  kindlebangla_curl: [kindlebangla]
  zlib_singlelogin: [en, modern]
  gutendex: [pd]
  standard_ebooks: [pd]
  oapen_doab: [pd]
  wikisource: [pd]
  hathitrust: [pd]
  doab: [pd]

# `bench --quick` indices: one modern English, one PD, one Bengali so
# even a quick run touches all three corpora (assuming the scraper
# being tested accepts that tag).
quick_indices: [0, 10, 15]
