# biblichor — self-hosted reading-list -> Kindle automation
#
# One-command setup:
#   ./deploy/bootstrap.sh            (interactive: prompts for the 5 secrets)
# or:
#   cp deploy/env.example .env       (fill in values)
#   docker compose -f deploy/compose.yml up -d
#
# Services:
#   biblichor       (this app, port 8090)
#   flaresolverr    (Cloudflare challenge solver, port 8191 internal)
#   bookorbit       (library + reader + Kobo/KOReader/OPDS, port 3000)
#   bookorbit-db    (Postgres 16 + pgvector, internal)
#   clamav          (optional, profile=av — only if BIBLICHOR_USE_CLAMAV=1)

name: biblichor

services:

  biblichor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ghcr.io/sutanunandigrami/biblichor:latest
    container_name: biblichor
    restart: unless-stopped
    ports:
      - "${BIBLICHOR_PORT:-8090}:8090"
    volumes:
      - ../data:/data
      - ../config:/app/config
      - ../library:/library
      # Phase 6v.1: host Docker socket for the in-app "Upgrade BookOrbit"
      # button. biblichor uses this to pull the candidate image, dump
      # the bookorbit Postgres DB, recreate the bookorbit container at
      # the new tag, and roll back on failure. This is a privilege
      # boundary — anyone who compromises biblichor can manage every
      # container on the host. Comment out and remove the group_add
      # entry below to disable; the upgrade UI then reports
      # docker_socket_available=false and the Apply button stays hidden.
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the repo's deploy/ directory so apply_upgrade can mutate
      # compose.yml (image SHA swap on apply, revert on rollback).
      - ../deploy:/app/deploy
      # Mount the host .env so apply_upgrade's `docker compose --env-file`
      # can resolve BOOKORBIT_DB_PASSWORD etc. when restarting the
      # bookorbit service.
      - ../.env:/app/.env:ro
    # Phase 6v.1: docker group passthrough. The host docker socket is
    # owned by root:docker; UID 1000 inside the container needs the
    # docker GID to write to it. Defaults to 999 (debian/ubuntu default);
    # set DOCKER_GID in .env if your host uses a different value (run
    # `getent group docker | cut -d: -f3` to find it).
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      CONFIG_PATH: /app/config/config.yaml
      LIBRARY_DB: /data/library.db
      # Forwarded to config.yaml at first boot by bootstrap.sh
      GMAIL_USER: "${GMAIL_USER}"
      GMAIL_APP_PASSWORD: "${GMAIL_APP_PASSWORD}"
      KINDLE_EMAIL: "${KINDLE_EMAIL}"
      # Pass BookOrbit admin creds so biblichor can auto-seed its
      # encrypted secrets store on first start (Phase 6p.8). After
      # that, the encrypted store is the source of truth.
      BOOKORBIT_ADMIN_USER: "${BOOKORBIT_ADMIN_USER}"
      BOOKORBIT_ADMIN_PASSWORD: "${BOOKORBIT_ADMIN_PASSWORD}"
      # Container-internal hostnames. These override config.yaml /
      # config/.env, which may carry stale localhost values from
      # pre-compose installs.
      FLARESOLVERR_URL: "http://flaresolverr:8191/v1"
      CF_BYPASS_URL: "http://cf-bypass:8000"
      BOOKORBIT_URL: "${BOOKORBIT_URL:-http://bookorbit:3000}"
      # Phase 6v.1 hotfix: relative bind-mount paths in compose.yml
      # (e.g. ../data/bookorbit-db) resolve against the project
      # directory the docker daemon is told about, NOT against
      # /app/deploy/compose.yml inside the biblichor container. If
      # apply_upgrade runs `docker compose -f /app/deploy/compose.yml`
      # without --project-directory, the daemon defaults to the
      # compose-file dir (/app/deploy) and the relative volumes end
      # up at /app/data — a brand-new empty directory instead of the
      # real persistent data. We pass the host-side repo path here
      # so apply_upgrade can forward it as --project-directory.
      # ${PWD} substitutes at compose-up time to the directory the
      # user invoked compose from (which is the repo root).
      HOST_REPO_PATH: "${PWD}"
    depends_on:
      flaresolverr:
        condition: service_healthy
      cf-bypass:
        condition: service_started
      bookorbit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - biblichor

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: biblichor-flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: "${FLARESOLVERR_LOG_LEVEL:-info}"
      TZ: "${TZ:-Etc/UTC}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8191/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - biblichor

  # Phase 6w.2: sarperavci/CloudflareBypassForScraping sidecar.
  # Used by annas_cloakbrowser when curl-cffi + FlareSolverr both fail
  # against a Cloudflare interactive challenge. Default-on (no profile).
  cf-bypass:
    image: sarperavci/cloudflarebypassforscraping:latest
    container_name: biblichor-cf-bypass
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - biblichor

  # BookOrbit replaces Calibre-Web as the library frontend. We hand books
  # off via the shared /library mount; @parcel/watcher inside the
  # container picks them up via embedded metadata. See Phase 6 plan.
  bookorbit-db:
    image: pgvector/pgvector:pg16@sha256:7d400e340efb42f4d8c9c12c6427adb253f726881a9985d2a471bf0eed824dff
    container_name: biblichor-bookorbit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${BOOKORBIT_DB_USER:-bookorbit}"
      POSTGRES_PASSWORD: "${BOOKORBIT_DB_PASSWORD}"
      POSTGRES_DB: "${BOOKORBIT_DB_NAME:-bookorbit}"
    volumes:
      - ../data/bookorbit-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOOKORBIT_DB_USER:-bookorbit} -d ${BOOKORBIT_DB_NAME:-bookorbit}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - biblichor

  bookorbit:
    # Pinned to a specific tag, not :latest. Bumping requires a
    # deliberate decision + a quick re-run of `biblichor bookorbit-setup`
    # to confirm the API shape hasn't drifted. See review M-7.
    image: ghcr.io/bookorbit/bookorbit:1.3.0
    container_name: biblichor-bookorbit
    restart: unless-stopped
    ports:
      - "${BOOKORBIT_PORT:-3000}:3000"
    volumes:
      - ../library:/books
      - ../data/bookorbit:/data
    environment:
      PUID: "1000"
      PGID: "1000"
      POSTGRES_HOST: bookorbit-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${BOOKORBIT_DB_USER:-bookorbit}"
      POSTGRES_PASSWORD: "${BOOKORBIT_DB_PASSWORD}"
      POSTGRES_DB: "${BOOKORBIT_DB_NAME:-bookorbit}"
      JWT_SECRET: "${BOOKORBIT_JWT_SECRET}"
      SETUP_BOOTSTRAP_TOKEN: "${BOOKORBIT_SETUP_TOKEN}"
      APP_URL: "${BOOKORBIT_URL:-http://localhost:3000}"
      NODE_MAX_OLD_SPACE_SIZE: "${BOOKORBIT_NODE_HEAP_MB:-2048}"
    depends_on:
      bookorbit-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - biblichor

    # Optional — `docker compose --profile av up -d` to include scanning.
  # biblichor falls back to hygiene-only checks if CLAMAV_HOST is unset
  # or unreachable, so this is genuinely optional (see audit batch).
  clamav:
    image: clamav/clamav:latest
    container_name: biblichor-clamav
    restart: unless-stopped
    profiles:
      - av
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    volumes:
      - ../data/clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - biblichor

  # Phase 6s.6 - optional Tor SOCKS5 sidecar for Anna's onion fallback.
  # Off by default; `docker compose --profile tor up -d` to include.
  # When running, set scrapers.tor_enabled=true in config.yaml and
  # the annas_curl ladder routes through socks5h://tor:9050 as a
  # last rung.
  tor:
    image: dperson/torproxy:latest
    container_name: biblichor-tor
    restart: unless-stopped
    profiles:
      - tor
    networks:
      - biblichor
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  biblichor:
    driver: bridge
