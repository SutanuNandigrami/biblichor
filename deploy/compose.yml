# biblichor — self-hosted reading-list -> Kindle automation
#
# One-command setup:
#   ./deploy/bootstrap.sh            (interactive: prompts for the 5 secrets)
# or:
#   cp deploy/env.example .env       (fill in values)
#   docker compose -f deploy/compose.yml up -d
#
# Services:
#   biblichor       (this app, port 8090)
#   flaresolverr    (Cloudflare challenge solver, port 8191 internal)
#   calibre-web     (e-book library UI, port 8083 internal — proxied at /library)
#   clamav          (optional, profile=av — only if BIBLICHOR_USE_CLAMAV=1)

name: biblichor

services:

  biblichor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ghcr.io/sutanunandigrami/biblichor:latest
    container_name: biblichor
    restart: unless-stopped
    ports:
      - "${BIBLICHOR_PORT:-8090}:8090"
    volumes:
      - ./data:/data
      - ./config:/app/config
      - ./library:/library
    environment:
      BIBLICHOR_DATA_DIR: /data
      BIBLICHOR_CONFIG: /app/config/config.yaml
      # Forwarded to config.yaml at first boot by bootstrap.sh
      GMAIL_USER: "${GMAIL_USER}"
      GMAIL_APP_PASSWORD: "${GMAIL_APP_PASSWORD}"
      KINDLE_EMAIL: "${KINDLE_EMAIL}"
      CALIBRE_WEB_USER: "${CALIBRE_WEB_USER:-admin}"
      CALIBRE_WEB_PASSWORD: "${CALIBRE_WEB_PASSWORD:-admin123}"
    depends_on:
      flaresolverr:
        condition: service_healthy
      calibre-web:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - biblichor

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: biblichor-flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: "${FLARESOLVERR_LOG_LEVEL:-info}"
      TZ: "${TZ:-Etc/UTC}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8191/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - biblichor

  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: biblichor-calibre-web
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "${TZ:-Etc/UTC}"
      DOCKER_MODS: "linuxserver/mods:universal-calibre"
    volumes:
      - ./config/calibre-web:/config
      - ./library:/books
    networks:
      - biblichor

  # Optional — `docker compose --profile av up -d` to include scanning.
  # biblichor falls back to hygiene-only checks if CLAMAV_HOST is unset
  # or unreachable, so this is genuinely optional (see audit batch).
  clamav:
    image: clamav/clamav:latest
    container_name: biblichor-clamav
    restart: unless-stopped
    profiles:
      - av
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    volumes:
      - ./data/clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - biblichor

networks:
  biblichor:
    driver: bridge
