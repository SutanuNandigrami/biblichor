[project]
name = "biblichor"
version = "0.1.0"
description = "Self-hosted Goodreads/Hardcover -> Anna's Archive -> Kindle automation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "apscheduler>=3.10",
  "curl-cffi>=0.7",
  "patchright>=1.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.1",
  "feedparser>=6.0",
  "aiosmtplib>=3.0",
  "rapidfuzz>=3.6",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "structlog>=24.1",
  "cryptography>=42",
  "requests>=2.31",
  "rsa>=4.9",
  "rarfile>=4.2",
  "indic-transliteration>=2.3",
]

[project.optional-dependencies]
browsers = ["playwright>=1.41", "camoufox>=0.4"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.20",
  "aiosmtpd>=1.4",
  "ruff>=0.3",
  "mypy>=1.8",
  "zstandard>=0.22",
]

[project.scripts]
endless-library = "endless_library.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits real external services; opt-in via LIVE_TESTS=1"]
addopts = "-x -q --strict-markers"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/endless_library"]
