{% extends "base.html" %}
{% block content %}
<h1 class="text-xl font-semibold mb-3">Logs</h1>
<form method="get" action="/logs" class="mb-4 flex gap-2">
  <select name="kind" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm">
    <option value="">all kinds</option>
    {% for k in kinds %}<option {% if k==kind_filter %}selected{% endif %}>{{ k }}</option>{% endfor %}
  </select>
  <button class="px-3 py-1.5 bg-slate-700 rounded text-sm">filter</button>
</form>
<ul class="text-xs space-y-1">
  {% for e in events %}
  <li class="border-b border-slate-900 py-1">
    <span class="text-slate-500">{{ e.ts }}</span>
    <span class="text-emerald-400">[{{ e.kind }}{% if e.scraper %}/{{ e.scraper }}{% endif %}]</span>
    {% if e.book_id %}<a href="/book/{{ e.book_id }}" class="text-blue-400">#{{ e.book_id }}</a>{% endif %}
    <span class="text-slate-300">{{ e.message }}</span>
  </li>
  {% else %}<li class="text-slate-500">no events.</li>{% endfor %}
</ul>
{% endblock %}
