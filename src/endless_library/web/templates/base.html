<!doctype html>
<html lang="en" class="bg-slate-950 text-slate-100">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}endless-library{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen">
  <nav class="bg-slate-900 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4">
      <a href="/queue" class="font-semibold text-emerald-400">endless-library</a>
      <a href="/queue" class="text-sm hover:text-emerald-300">Queue</a>
      <a href="/sources" class="text-sm hover:text-emerald-300">Sources</a>
      <a href="/scrapers" class="text-sm hover:text-emerald-300">Scrapers</a>
      <a href="/settings" class="text-sm hover:text-emerald-300">Settings</a>
      <a href="/logs" class="text-sm hover:text-emerald-300">Logs</a>
      <div class="flex-1"></div>
      <a href="/setup" class="text-xs px-2 py-1 rounded bg-slate-800 hover:bg-slate-700">setup</a>

      <form hx-post="/api/cycle/run-now" hx-swap="none" class="inline">
        <button class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded text-sm">Run now</button>
      </form>
    </div>
  </nav>
  <main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
